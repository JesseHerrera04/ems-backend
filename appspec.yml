version: 0.0
os: linux
files:
  - source: ems-backend.jar
    destination: /opt/ems-backend
  - source: deploy/ems-backend.service
    destination: /etc/systemd/system
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root
  BeforeInstall:
    - location: scripts/prepare.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/set-permissions.sh
      timeout: 30
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 30
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 150
      runas: root
